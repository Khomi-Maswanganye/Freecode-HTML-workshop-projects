<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Video Compilation Page</title>
  <style>
    body{font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;max-width:1100px;margin:28px auto;padding:0 16px;color:#111}
    h1{font-size:1.75rem;margin:0 0 8px}
    p{margin:0 0 16px}
    .video-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
    .card{background:#fff;border:1px solid #eee;padding:12px;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,0.03)}
    .card h2{font-size:1.05rem;margin:0 0 6px}
    .responsive-iframe{position:relative;padding-bottom:56.25%;height:0;overflow:hidden}
    .responsive-iframe iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <main>
    <h1>Video Compilation Page</h1>
    <p>Welcome to the compilation page of videos from my Responsive Web Design Certification on freeCodeCamp.</p>

    <section class="video-grid">
      <article class="card">
        <h2>Sotho Wedding Song</h2>
        <p>This is the first YouTube video.</p>
        <div class="responsive-iframe">
          <iframe src="https://www.youtube.com/embed/sIejm5Dn-Q8" title="Sotho Wedding Song" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      </article>

      <article class="card">
        <h2>Liphala Song</h2>
        <p>This is the second YouTube video.</p>
        <div class="responsive-iframe">
          <iframe src="https://www.youtube.com/embed/3hrMOkuZzGs" title="Liphala Song" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      </article>

      <article class="card">
        <h2>Ngiqome Kwazulu Song</h2>
        <p>This is the third YouTube video.</p>
        <div class="responsive-iframe">
          <iframe src="https://www.youtube.com/embed/_mQauqOM5Cc" title="Ngiqome Kwazulu Song" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
